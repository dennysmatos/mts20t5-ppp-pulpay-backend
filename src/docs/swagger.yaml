  /webhooks/test:
    post:
      operationId: testWebhook
      tags: [Webhooks]
      summary: Simula o disparo de um evento de webhook gerando assinatura HMAC SHA-256 no header X-Signature
      description: |
        Simula o disparo de uma notificação de evento e valida a geração da assinatura criptográfica **HMAC SHA-256** (`X-Signature: sha256=<64_hex_chars>`), registrando a tentativa em `deliveryLogs`.

        ### Postman Test Script (`Tests`)
        ```javascript
        const statusCode = pm.response.code;
        const jsonData = pm.response.json();

        pm.test("Tempo de resposta menor que 1000ms e Content-Type JSON", () => {
            pm.expect(pm.response.responseTime).to.be.below(1000);
            pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        if (statusCode === 200) {
            pm.test("200 OK - Disparo simulado e mensagem de confirmação", () => {
                pm.response.to.have.status(200);
                pm.expect(jsonData).to.have.property("message", "Disparo de webhook simulado com assinatura HMAC SHA-256 gerada");
                pm.expect(jsonData).to.have.property("event").that.is.a("string");
                pm.expect(jsonData).to.have.property("payload").that.is.an("object");
                pm.expect(jsonData).to.have.property("deliveryLog").that.is.an("object");
            });

            pm.test("Segurança HMAC - Header X-Signature deve conter hash SHA-256 válido (sha256=<64 hex>)", () => {
                pm.expect(jsonData.headers).to.have.property("X-Signature");
                pm.expect(jsonData.headers["X-Signature"]).to.match(/^sha256=[a-f0-9]{64}$/);
                pm.expect(jsonData.deliveryLog.signature).to.eql(jsonData.headers["X-Signature"]);
            });
        } else if (statusCode === 404) {
            pm.test("404 Not Found - Webhook informado não encontrado", () => {
                pm.response.to.have.status(404);
                pm.expect(jsonData).to.have.property("error", "WEBHOOK_NOT_FOUND");
                pm.expect(jsonData).to.have.property("message", "Webhook não encontrado para o lojista autenticado");
            });
        } else if (statusCode === 401) {
            pm.test("401 Unauthorized - Token JWT ausente ou inválido", () => {
                pm.response.to.have.status(401);
                pm.expect(jsonData).to.have.property("error", "UNAUTHORIZED");
            });
        }
        ```
