  /transactions:
    post:
      operationId: createTransaction
      tags: [Transactions]
      summary: Cria uma nova cobrança ou pagamento com suporte a Idempotency-Key
      description: |
        Processa uma movimentação financeira (`CHARGE`, `CREDIT`, `PAYMENT`, `DEBIT`) com suporte ao header `Idempotency-Key`.
        - **Primeira execução:** retorna `201 Created`, `idempotentReplayed: false` e atualiza o saldo da carteira (quando `status: "PAID"`).
        - **Execução repetida com mesma `Idempotency-Key`:** retorna `200 OK`, `idempotentReplayed: true` e preserva a transação original sem duplicar o impacto financeiro.

        ### Postman Test Script (`Tests`)
        ```javascript
        const statusCode = pm.response.code;
        const jsonData = pm.response.json();

        pm.test("Tempo de resposta menor que 1000ms e Content-Type JSON", () => {
            pm.expect(pm.response.responseTime).to.be.below(1000);
            pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        if (statusCode === 201) {
            pm.test("201 Created - Nova transação processada com sucesso", () => {
                pm.response.to.have.status(201);
                pm.expect(jsonData).to.have.property("message", "Transação processada com sucesso");
                pm.expect(jsonData).to.have.property("idempotentReplayed", false);
                pm.expect(jsonData.transaction).to.have.property("_id").that.is.a("string");
                pm.expect(jsonData.transaction.status).to.be.oneOf(["PENDING", "PAID", "FAILED"]);
                pm.expect(jsonData.accountBalance).to.be.a("number").and.to.be.at.least(0);
            });

            pm.collectionVariables.set("transaction_id", jsonData.transaction._id);
        } else if (statusCode === 200) {
            pm.test("200 OK - Replay idempotente sem duplicar movimentação financeira", () => {
                pm.response.to.have.status(200);
                pm.expect(jsonData).to.have.property("message", "Requisição idempotente: retornando transação processada anteriormente");
                pm.expect(jsonData).to.have.property("idempotentReplayed", true);
                pm.expect(jsonData.transaction).to.have.property("_id");
            });
        } else if (statusCode === 400) {
            pm.test("400 Bad Request - Erro de validação de parâmetros", () => {
                pm.response.to.have.status(400);
                pm.expect(jsonData.error).to.be.oneOf([
                    "MISSING_ACCOUNT_ID",
                    "INVALID_AMOUNT",
                    "INVALID_TRANSACTION_TYPE",
                    "INVALID_TRANSACTION_STATUS"
                ]);
            });
        } else if (statusCode === 404) {
