  /transactions/{id}/refund:
    post:
      operationId: refundTransaction
      tags: [Transactions]
      summary: Solicita o estorno (REFUND) de uma transação com status PAID
      description: |
        Realiza o estorno financeiro de uma transação e altera seu estado para `REFUNDED`.
        - **Máquina de Estados:** Apenas transações com status `PAID` podem ser estornadas. Tentativas de estornar transações `PENDING`, `FAILED` ou já `REFUNDED` retornam `422 Unprocessable Entity`.

        ### Postman Test Script (`Tests`)
        ```javascript
        const statusCode = pm.response.code;
        const jsonData = pm.response.json();

        pm.test("Tempo de resposta menor que 1000ms e Content-Type JSON", () => {
            pm.expect(pm.response.responseTime).to.be.below(1000);
            pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        if (statusCode === 200) {
            pm.test("200 OK - Estorno realizado e status alterado para REFUNDED", () => {
                pm.response.to.have.status(200);
                pm.expect(jsonData).to.have.property("message", "Estorno de transação realizado com sucesso");
                pm.expect(jsonData.transaction).to.have.property("status", "REFUNDED");
                pm.expect(jsonData.transaction).to.have.property("refundedAt").that.is.a("string");
                pm.expect(jsonData.transaction).to.have.property("refundReason").that.is.a("string");
                pm.expect(jsonData.accountBalance).to.be.a("number").and.to.be.at.least(0);
            });
        } else if (statusCode === 422) {
            pm.test("422 Unprocessable Entity - Transição de estado inválida ou saldo insuficiente para estorno", () => {
                pm.response.to.have.status(422);
                pm.expect(jsonData.error).to.be.oneOf([
                    "INVALID_STATE_TRANSITION",
                    "TRANSACTION_ALREADY_REFUNDED",
                    "INSUFFICIENT_FUNDS_FOR_REFUND"
                ]);
            });
        } else if (statusCode === 404) {
            pm.test("404 Not Found - Transação não encontrada", () => {
                pm.response.to.have.status(404);
                pm.expect(jsonData).to.have.property("error", "TRANSACTION_NOT_FOUND");
                pm.expect(jsonData).to.have.property("message", "Transação não encontrada para o lojista autenticado");
            });
        } else if (statusCode === 401) {
            pm.test("401 Unauthorized - Token JWT ausente ou inválido", () => {
                pm.response.to.have.status(401);
                pm.expect(jsonData).to.have.property("error", "UNAUTHORIZED");
            });
        }
        ```
