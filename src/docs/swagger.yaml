  /accounts:
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Cria uma nova conta/carteira vinculada ao lojista autenticado
      description: |
        Cria uma conta/carteira financeira vinculada ao lojista autenticado na moeda `BRL`.
        Impede a criação de contas com saldo inicial negativo (`422 NEGATIVE_BALANCE_NOT_ALLOWED`) ou moeda diferente de `BRL` (`422 UNSUPPORTED_CURRENCY`).

        ### Postman Test Script (`Tests`)
        ```javascript
        const statusCode = pm.response.code;
        const jsonData = pm.response.json();

        pm.test("Tempo de resposta menor que 1000ms e Content-Type JSON", () => {
            pm.expect(pm.response.responseTime).to.be.below(1000);
            pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        if (statusCode === 201) {
            pm.test("201 Created - Conta criada com sucesso, moeda BRL e saldo >= 0", () => {
                pm.response.to.have.status(201);
                pm.expect(jsonData).to.have.property("message", "Conta criada com sucesso");
                pm.expect(jsonData.account).to.have.property("_id").that.is.a("string");
                pm.expect(jsonData.account).to.have.property("currency", "BRL");
                pm.expect(jsonData.account).to.have.property("status", "ACTIVE");
                pm.expect(jsonData.account.balance).to.be.a("number").and.to.be.at.least(0);
            });

            pm.collectionVariables.set("account_id", jsonData.account._id);
        } else if (statusCode === 400) {
            pm.test("400 Bad Request - Saldo inicial não numérico", () => {
                pm.response.to.have.status(400);
                pm.expect(jsonData).to.have.property("error", "INVALID_BALANCE");
                pm.expect(jsonData).to.have.property("message", "O saldo inicial (initialBalance) deve ser um valor numérico válido");
            });
        } else if (statusCode === 401) {
            pm.test("401 Unauthorized - Token JWT ausente ou inválido", () => {
                pm.response.to.have.status(401);
                pm.expect(jsonData).to.have.property("error", "UNAUTHORIZED");
                pm.expect(jsonData.message).to.be.oneOf([
                    "Token de autenticação ausente ou malformado. Utilize o formato Authorization: Bearer <token>",
                    "Token JWT não informado no header Authorization",
                    "Token JWT inválido ou expirado"
                ]);
            });
        } else if (statusCode === 422) {
            pm.test("422 Unprocessable Entity - Violação de regra financeira (saldo negativo ou moeda inválida)", () => {
                pm.response.to.have.status(422);
                pm.expect(jsonData.error).to.be.oneOf(["NEGATIVE_BALANCE_NOT_ALLOWED", "UNSUPPORTED_CURRENCY"]);
                pm.expect(jsonData.message).to.be.oneOf([
                    "Operação não permitida: o saldo da conta não pode ser negativo",
                    "Moeda não suportada. O Pulsar Payments opera exclusivamente com BRL"
                ]);
            });
        }
        ```
