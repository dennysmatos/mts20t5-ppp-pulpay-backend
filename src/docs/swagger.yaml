  /webhooks:
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Cadastra uma URL de destino para notificações de eventos de pagamento
      description: |
        Registra um endpoint HTTP/HTTPS para receber eventos assinados via HMAC SHA-256 (`transaction.paid`, `transaction.failed`, `transaction.refunded`, `webhook.test`).

        ### Postman Test Script (`Tests`)
        ```javascript
        const statusCode = pm.response.code;
        const jsonData = pm.response.json();

        pm.test("Tempo de resposta menor que 1000ms e Content-Type JSON", () => {
            pm.expect(pm.response.responseTime).to.be.below(1000);
            pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        if (statusCode === 201) {
            pm.test("201 Created - Webhook registrado com sucesso", () => {
                pm.response.to.have.status(201);
                pm.expect(jsonData).to.have.property("message", "Webhook registrado com sucesso");
                pm.expect(jsonData.webhook).to.have.property("_id").that.is.a("string");
                pm.expect(jsonData.webhook).to.have.property("url").that.match(/^https?:\/\//);
                pm.expect(jsonData.webhook).to.have.property("active", true);
                pm.expect(jsonData.webhook.events).to.be.an("array").that.is.not.empty;
            });

            pm.collectionVariables.set("webhook_id", jsonData.webhook._id);
        } else if (statusCode === 400) {
            pm.test("400 Bad Request - URL do webhook inválida", () => {
                pm.response.to.have.status(400);
                pm.expect(jsonData).to.have.property("error", "INVALID_WEBHOOK_URL");
                pm.expect(jsonData).to.have.property("message", "Informe uma URL válida (http:// ou https://) para o cadastro do webhook");
            });
        } else if (statusCode === 401) {
            pm.test("401 Unauthorized - Token JWT ausente ou inválido", () => {
                pm.response.to.have.status(401);
                pm.expect(jsonData).to.have.property("error", "UNAUTHORIZED");
            });
        }
        ```
