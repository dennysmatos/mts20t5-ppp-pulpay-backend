        '404':
          description: Conta informada não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AccountNotFound:
                  summary: 404 Not Found - Conta informada não existe
                  value:
                    error: ACCOUNT_NOT_FOUND
                    message: Conta informada não encontrada para o lojista autenticado
        '422':
          description: Regra de negócio violada (saldo insuficiente, valor <= 0 ou status inicial inválido)
          content:
            application/json:
              schema:
